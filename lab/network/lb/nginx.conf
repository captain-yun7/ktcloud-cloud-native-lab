# 네트워킹 과목 로드밸런서 실습: — 두 AZ의 web으로 나눠 보내고, 실패한 쪽은 10초 동안 빼 둔다(수동 헬스 체크)
events {}
http {
  upstream web {
    server 10.0.1.10:80 max_fails=1 fail_timeout=10s;   # AZ-a
    server 10.0.3.10:80 max_fails=1 fail_timeout=10s;   # AZ-b
  }
  server {
    listen 9090;
    location / {
      proxy_pass http://web;
      proxy_connect_timeout 1s;
    }
  }
}
