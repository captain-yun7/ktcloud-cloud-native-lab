# Loki 3.6 단일 바이너리(실습용) — 모니터링 과목. 저장소는 파드 안 파일시스템, 인증 없음
deploymentMode: SingleBinary
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index: {prefix: index_, period: 24h}
  limits_config:
    retention_period: 48h
singleBinary:
  replicas: 1
  resources:
    requests: {cpu: 100m, memory: 256Mi}
read: {replicas: 0}
write: {replicas: 0}
backend: {replicas: 0}
gateway: {enabled: false}
chunksCache: {enabled: false}
resultsCache: {enabled: false}
lokiCanary: {enabled: false}
test: {enabled: false}
