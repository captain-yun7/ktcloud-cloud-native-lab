# 따라 하기용 백엔드 — 받은 요청(헤더·경로)을 JSON으로 돌려준다. /delay/N, /status/N, /unstable 도 있다
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin
  namespace: api
spec:
  selector:
    matchLabels: {app: httpbin}
  template:
    metadata:
      labels: {app: httpbin}
    spec:
      containers:
      - name: httpbin
        image: mccutchen/go-httpbin:2.25.0
        ports: [{containerPort: 8080}]
        resources:
          requests: {cpu: 10m, memory: 16Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin
  namespace: api
spec:
  selector: {app: httpbin}
  ports: [{name: http, port: 80, targetPort: 8080}]
