# API Gateway 라우팅 규칙 실습용 — 응답이 "hello v1" / "hello v2" 한 줄이라 어느 쪽으로 갔는지 바로 보인다
apiVersion: apps/v1
kind: Deployment
metadata: {name: hello-v1, namespace: api}
spec:
  selector: {matchLabels: {app: hello, version: v1}}
  template:
    metadata: {labels: {app: hello, version: v1}}
    spec:
      containers:
      - name: hello
        image: hashicorp/http-echo:1.0
        args: ["-text=hello v1", "-listen=:5678"]
        ports: [{containerPort: 5678}]
        resources: {requests: {cpu: 5m, memory: 8Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: hello-v2, namespace: api}
spec:
  selector: {matchLabels: {app: hello, version: v2}}
  template:
    metadata: {labels: {app: hello, version: v2}}
    spec:
      containers:
      - name: hello
        image: hashicorp/http-echo:1.0
        args: ["-text=hello v2", "-listen=:5678"]
        ports: [{containerPort: 5678}]
        resources: {requests: {cpu: 5m, memory: 8Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: hello-v1, namespace: api}
spec:
  selector: {app: hello, version: v1}
  ports: [{name: http, port: 80, targetPort: 5678}]
---
apiVersion: v1
kind: Service
metadata: {name: hello-v2, namespace: api}
spec:
  selector: {app: hello, version: v2}
  ports: [{name: http, port: 80, targetPort: 5678}]
